<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obstacle Jump</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container" data-state="start">
    <canvas id="game-canvas" width="800" height="300"></canvas>

    <div id="start-screen" class="overlay visible">
      <h1>Obstacle Jump</h1>
      <p>Press Space / Up Arrow or tap to start</p>
      <p class="score-line">High Score: <span id="start-high-score">0</span></p>
    </div>

    <div id="game-over-screen" class="overlay">
      <h1>Game Over</h1>
      <p class="score-line">Score: <span id="final-score">0</span></p>
      <p class="score-line">High Score: <span id="game-over-high-score">0</span></p>
      <p>Press Space / Up Arrow or tap to restart</p>
    </div>
  </div>

  <!-- Load order matters: game.js constructs instances of all of these on init. -->
  <script src="player.js"></script>
  <script src="obstacles.js"></script>
  <script src="collision.js"></script>
  <script src="score.js"></script>
  <script src="game.js"></script>
</body>
</html>
